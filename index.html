<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASIC WRITING</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=17">
</head>
<body>

    <div id="login-modal" class="login-overlay" style="display: none;">
        <div class="login-card-custom">
            <!-- Miss Nguyet Avatar Brand Ring -->
            <div class="login-teacher-avatar-wrap">
                <div class="login-teacher-halo">
                    <img src="miss_nguyet.jpg" alt="Miss Nguyet" class="login-teacher-avatar">
                </div>
                <span class="login-teacher-badge">
                    <i class="fa-solid fa-certificate"></i> LEAD INSTRUCTOR
                </span>
            </div>

            <div class="login-brand-tag">
                <i class="fa-solid fa-graduation-cap"></i> Welcome to Miss Nguyet's Class!
            </div>
            <div class="login-course-title">BASIC WRITING &amp; SENTENCE STRUCTURES</div>
            <h2 class="login-title-custom">NHẬP THÔNG TIN<br/>ĐỂ BẮT ĐẦU HỌC 🚀</h2>
            
            <div class="login-form">
                <div class="input-group-custom">
                    <label for="student-name">
                        <i class="fa-solid fa-user-pen" style="color: #6366f1;"></i> HỌ VÀ TÊN HỌC VIÊN:
                    </label>
                    <input type="text" id="student-name" placeholder="Nhập họ và tên học viên..." autocomplete="off" onkeydown="if(event.key==='Enter') document.getElementById('student-class').focus()">
                </div>

                <div class="input-group-custom">
                    <label for="student-class">
                        <i class="fa-solid fa-chalkboard-user" style="color: #06b6d4;"></i> MÃ LỚP HỌC:
                    </label>
                    <input type="text" id="student-class" placeholder="Nhập mã lớp học... (Ví dụ: ONB104)" autocomplete="off" onkeydown="if(event.key==='Enter') saveStudentInfo()">
                </div>

                <button class="btn-login-custom" onclick="saveStudentInfo()">
                    <span>BẮT ĐẦU HỌC</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="login-footer-signature">
                    <a href="https://www.facebook.com/nguyetpham28" target="_blank" rel="noopener noreferrer">
                        <i class="fa-brands fa-facebook" style="color: #1877f2;"></i>
                        <span>ENGLISH WITH MISS NGUYET</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="dashboard-layout">
        <!-- Mobile Sidebar Backdrop Overlay -->
        <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleMobileSidebar(false)"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="https://www.facebook.com/nguyetpham28" target="_blank" class="galaxy-text">ENGLISH WITH MISS NGUYET</a>
                <button class="mobile-close-btn" onclick="toggleMobileSidebar(false)" aria-label="Đóng menu">✕</button>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Nav items generated by JS -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="mobile-menu-btn" onclick="toggleMobileSidebar(true)" aria-label="Mở menu">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="header-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                        <a href="https://www.facebook.com/nguyetpham28" target="_blank" class="galaxy-text" style="font-size: inherit; margin-left: 6px;">ENGLISH WITH MISS NGUYET</a>
                    </div>
                </div>
                <div class="header-actions" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center;">
                    <span id="student-info-display" style="font-weight: 600; color: var(--primary-color); font-size: 1.05rem; margin-right: 8px;"></span>
                    <button onclick="saveProgress()" style="padding: 8px 16px; border-radius: 20px; font-weight: bold; background: var(--bg-card); color: var(--primary-color); border: 2px solid var(--primary-color); cursor: pointer; transition: all 0.3s;" onmouseover="this.style.background='var(--primary-color)'; this.style.color='white'" onmouseout="this.style.background='var(--bg-card)'; this.style.color='var(--primary-color)'">💾 LƯU TIẾN ĐỘ</button>
                    <button onclick="clearProgress()" style="padding: 8px 16px; border-radius: 20px; font-weight: bold; background: var(--bg-card); color: #ef4444; border: 2px solid #ef4444; cursor: pointer; transition: all 0.3s;" onmouseover="this.style.background='#ef4444'; this.style.color='white'" onmouseout="this.style.background='var(--bg-card)'; this.style.color='#ef4444'">🗑 XÓA LỊCH SỬ</button>
                    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Chuyển chế độ Sáng/Tối">
                        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    </button>
                </div>
            </header>

            <div class="content-wrapper" id="content-wrapper">
                <!-- Content injected here via JS -->
            </div>
        </main>
    </div>

    <!-- Modal for Detailed Lesson -->
    <div class="modal-overlay" id="lesson-modal">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <span class="modal-icon" id="modal-icon">📚</span>
                    <h2 class="modal-title" id="modal-title">Tiêu đề bài học</h2>
                </div>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <!-- Notification overlay for locked content -->
    <div id="locked-notification" class="notification">
        <span>Bài học này chưa được mở khóa.</span>
    </div>

    <script src="script.js?v=233"></script>
    <script src="practice.js?v=27"></script>
    <script src="final_review.js?v=11"></script>
</body>
</html>
